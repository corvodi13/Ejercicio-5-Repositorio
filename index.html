<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agencia de Netflix - Bootstrap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div id="app-bootstrap" class="container mt-5">
    <h2 class="mb-3">Control de Suscriptores</h2>

    <button type="button" class="btn btn-primary mb-3" id="body_btNuevoSuscriptor">+Agregar Suscriptor</button>

    <div class="alert alert-info shadow-sm">
<h5 class="mb-3">Reporte</h5>

    Porcentaje de suscriptores que no pagaran servicio de conexion: <span id="body_lblPorcentajeNoConexion" class="fw-bold">0%</span><br>
    Plan favorito: <span id="body_lblPlanFavorito" class="fw-bold">0</span><br>

    </div>

    <div class="mt-4">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="bg-light p-3 border-bottom">
          <h4 class="fw-bold text-dark">Suscriptores registrados</h4>
          <small class="text-secondary">Historial de suscriptores agregados al sistema</small>
        </div>

        <div class="card-body bg-light" id="body_lista">
          <div class="text-center text-secondary py-4" id="body_listaVacia">
            Aún no hay suscriptores registrados
          </div>
        </div>
      </div>
    </div>
  </div>

    <div class="modal fade" id="suscriptor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">Ingresar Datos de Suscriptor</h5>
        </div>

        <div class="modal-body">
          <label class="form-label">Cedula:</label>
          <input type="text" class="form-control mb-3" id="suscriptor_inCedula">

          <label class="form-label">Planes:</label>
          <select class="form-select" id="suscriptor_inPlanes">
            <option value="A">A:para 1TV</option>
            <option value="B">B:para 2TVs</option>
            <option value="C">C:para 5TVs</option>
          </select>
          <br>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="suscriptor_btCancelar">Cancelar</button>
          <button type="button" class="btn btn-success" id="suscriptor_btAceptar">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import Cl_cAgencia from "./dist/controllers/Cl_cAgencia.js";
    import Cl_cSuscriptor from "./dist/controllers/Cl_cSuscriptor.js";
    import Cl_vAgencia from "./dist/views/Cl_vAgencia.js";
    import Cl_vSuscriptor from "./dist/views/Cl_vSuscriptor.js";

    const vistaAgencia = new Cl_vAgencia();
    const vistaSuscriptor = new Cl_vSuscriptor();
    const controladorSuscriptor = new Cl_cSuscriptor(vistaSuscriptor);
    new Cl_cAgencia(vistaAgencia, controladorSuscriptor);
</script>
</body>
</html>
